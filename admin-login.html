<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Accessible Voting System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="site-header">
  <a href="index.html" class="brand">Accessible Voting System</a>
  <nav class="main-nav" aria-label="Primary">
    <a href="login.html">Voter Login</a>
  </nav>
</header>

<div class="accessibility-toolbar" role="region" aria-label="Accessibility options">
  <span>Accessibility:</span>
  <button id="toggle-contrast" type="button" aria-pressed="false">High contrast</button>
  <button id="font-decrease" type="button" aria-label="Decrease text size">A−</button>
  <span id="font-scale-label" aria-live="polite">100%</span>
  <button id="font-increase" type="button" aria-label="Increase text size">A+</button>
  <button id="font-reset" type="button">Reset text size</button>
</div>

<main id="main-content">
  <h1>Administrator Login</h1>
  <div id="status" class="status-message" hidden></div>

  <form id="admin-login-form" novalidate>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button type="submit" id="submit-btn">Log in</button>
  </form>

  <p class="hint">Default seeded credentials — username: <code>admin</code>, password: <code>Admin@12345</code> (change after seeding in any real deployment).</p>
</main>

<footer class="site-footer">
  <p>Accessible Voting System — Final Year Project Prototype</p>
</footer>

<script src="js/accessibility.js"></script>
<script src="js/api.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
